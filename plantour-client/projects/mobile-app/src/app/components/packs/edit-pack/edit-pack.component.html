<div class="page-container">
  <p-card>
    <ng-template pTemplate="header">
      <div class="card-header">
        <i class="pi pi-pencil"></i>
        <h2>Edit Pack</h2>
      </div>
    </ng-template>
    <div class="content">
      <div *ngIf="isLoading" class="loading-container">
        <i class="pi pi-spin pi-spinner"></i> Loading...
      </div>
      <form *ngIf="!isLoading" [formGroup]="packForm" (ngSubmit)="onSubmit()">
        <div class="form-field">
          <label for="shortDescription">Short Description <span class="required">*</span></label>
          <input 
            pInputText 
            id="shortDescription" 
            formControlName="shortDescription"
            placeholder="Enter pack description"
            [class.p-invalid]="isFieldInvalid('shortDescription')"
          />
          <small class="error-message" *ngIf="isFieldInvalid('shortDescription')">
            {{ getFieldError('shortDescription') }}
          </small>
        </div>

        <div class="form-field">
          <label for="description">Description</label>
          <textarea 
            id="description" 
            formControlName="description"
            rows="5"
            placeholder="Enter detailed description (optional)"
            class="form-textarea"
            [class.p-invalid]="isFieldInvalid('description')"
          ></textarea>
          <small class="error-message" *ngIf="isFieldInvalid('description')">
            {{ getFieldError('description') }}
          </small>
        </div>

        <div class="form-field">
          <label for="category">Category</label>
          <p-select
            id="category"
            formControlName="categoryId"
            [options]="categories"
            optionLabel="name"
            optionValue="id"
            placeholder="Select a category (optional)"
            [showClear]="true"
            [style]="{'width': '100%'}"
          />
        </div>

        <div class="form-actions">
          <p-button 
            label="Cancel" 
            icon="pi pi-times" 
            severity="secondary"
            type="button"
            (onClick)="onCancel()"
            [disabled]="isSubmitting"
          ></p-button>
          <p-button 
            label="Update" 
            icon="pi pi-check" 
            type="submit"
            [disabled]="isSubmitting"
            [loading]="isSubmitting"
          ></p-button>
        </div>
      </form>
    </div>
  </p-card>
</div>
