<app-content-layout>
<div class="page-container">
  <p-card>
    <ng-template pTemplate="header">
      <div class="card-header">
        <i class="pi pi-plus"></i>
        <h2>Add Pack</h2>
      </div>
    </ng-template>
    <div class="content">
      <form [formGroup]="packForm" (ngSubmit)="onSubmit()">
        <div class="form-field">
          <label for="name">Name <span class="required">*</span></label>
          <input 
            pInputText 
            id="name" 
            formControlName="name"
            placeholder="Enter pack description"
            [class.p-invalid]="isFieldInvalid('name')"
          />
          <small class="error-message" *ngIf="isFieldInvalid('name')">
            {{ getFieldError('name') }}
          </small>
        </div>

        <div class="form-field">
          <label for="description">Description</label>
          <textarea 
            id="description" 
            formControlName="description"
            rows="5"
            placeholder="Enter detailed description (optional)"
            class="form-textarea"
            [class.p-invalid]="isFieldInvalid('description')"
          ></textarea>
          <small class="error-message" *ngIf="isFieldInvalid('description')">
            {{ getFieldError('description') }}
          </small>
        </div>
        <div class="form-actions">
          <p-button 
            label="Cancel" 
            icon="pi pi-times" 
            severity="secondary"
            type="button"
            (onClick)="onCancel()"
            [disabled]="isSubmitting"
          ></p-button>
          <p-button 
            label="Create" 
            icon="pi pi-check" 
            type="submit"
            [disabled]="isSubmitting"
            [loading]="isSubmitting"
          ></p-button>
        </div>
      </form>
    </div>
  </p-card>
</div>
</app-content-layout>
