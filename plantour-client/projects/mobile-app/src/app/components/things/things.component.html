<div class="page-container">
  <p-card>
    <ng-template pTemplate="header">
      <div class="card-header">
        <div class="header-left">
          <i class="pi pi-box"></i>
          <h2>Things</h2>
        </div>
        <div class="header-right">
          <p-button 
            icon="pi pi-plus" 
            [rounded]="true"
            [text]="true"
            (onClick)="onAddThing()"
            severity="primary"
            [attr.aria-label]="'Add thing'">
          </p-button>
        </div>
      </div>
    </ng-template>
    <div class="content">
      @if (userThings && userThings!.length > 0) {
        <p-listbox 
          [options]="userThings!" 
          [(ngModel)]="selectedThing"
          (onChange)="onSelectionChange()"
          optionLabel="shortDescription"
          [listStyle]="{'max-height': '60vh'}"
          styleClass="w-full">
          <ng-template let-thing pTemplate="item">
            <div class="thing-item">
              <div class="thing-main">
                <div class="thing-title">{{ thing.shortDescription }}</div>
                @if (thing.description) {
                  <div class="thing-subtitle">
                    {{ thing.description }}
                  </div>
                }
              </div>
              <div class="thing-details">
                <div class="thing-info-section">
                  @if (thing.categoryName) {
                    <span class="thing-badge">{{ thing.categoryName }}</span>
                  }
                </div>
              </div>
            </div>
          </ng-template>
        </p-listbox>
      } @else {
        <div class="empty-state">
          <i class="pi pi-box"></i>
          <p>No things yet</p>
          <p class="hint">Start adding your things to track your gear</p>
        </div>
      }
    </div>
  </p-card>
</div>
