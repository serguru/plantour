<div class="page-container">
  <p-card>
    <ng-template pTemplate="header">
      <div class="card-header">
        <i class="pi pi-plus"></i>
        <h2>Add Trip</h2>
      </div>
    </ng-template>
    <div class="content">
      <form [formGroup]="tripForm" (ngSubmit)="onSubmit()">
        <div class="form-field">
          <label for="shortDescription">Name <span class="required">*</span></label>
          <input 
            pInputText 
            id="shortDescription" 
            formControlName="shortDescription"
            placeholder="Enter trip name"
            [class.p-invalid]="isFieldInvalid('shortDescription')"
          />
          <small class="error-message" *ngIf="isFieldInvalid('shortDescription')">
            {{ getFieldError('shortDescription') }}
          </small>
        </div>

        <div class="form-field">
          <label for="description">Description</label>
          <textarea 
            id="description" 
            formControlName="description"
            rows="5"
            placeholder="Enter detailed description (optional)"
            class="form-textarea"
            [class.p-invalid]="isFieldInvalid('description')"
          ></textarea>
          <small class="error-message" *ngIf="isFieldInvalid('description')">
            {{ getFieldError('description') }}
          </small>
        </div>

        <div class="form-field">
          <label for="startDate">Start Date</label>
          <p-datepicker
            id="startDate"
            formControlName="startDate"
            placeholder="Select start date"
            [showIcon]="true"
            [iconDisplay]="'input'"
            [style]="{'width': '100%'}"
            dateFormat="mm/dd/yy"
          />
          <small class="error-message" *ngIf="isFieldInvalid('startDate')">
            {{ getFieldError('startDate') }}
          </small>
        </div>

        <div class="form-field">
          <label for="endDate">End Date</label>
          <p-datepicker
            id="endDate"
            formControlName="endDate"
            placeholder="Select end date"
            [showIcon]="true"
            [iconDisplay]="'input'"
            [style]="{'width': '100%'}"
            dateFormat="mm/dd/yy"
          />
          <small class="error-message" *ngIf="isFieldInvalid('endDate')">
            {{ getFieldError('endDate') }}
          </small>
        </div>

        <div class="form-actions">
          <p-button 
            label="Cancel" 
            icon="pi pi-times" 
            severity="secondary"
            type="button"
            (onClick)="onCancel()"
            [disabled]="isSubmitting"
          ></p-button>
          <p-button 
            label="Create" 
            icon="pi pi-check" 
            type="submit"
            [disabled]="isSubmitting"
            [loading]="isSubmitting"
          ></p-button>
        </div>
      </form>
    </div>
  </p-card>
</div>
