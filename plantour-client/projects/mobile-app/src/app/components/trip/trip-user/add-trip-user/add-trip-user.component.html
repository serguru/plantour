<div class="page-container">
  <p-card>
    <ng-template pTemplate="header">
      <div class="card-header">
        <i class="pi pi-plus"></i>
        <h2>Add Trip User</h2>
      </div>
    </ng-template>
    <div class="content">
      <form [formGroup]="tripUserForm" (ngSubmit)="onSubmit()">
        <div class="form-field">
          <label for="adminParticipantId">Admin Participant ID <span class="required">*</span></label>
          <input 
            pInputText 
            id="adminParticipantId" 
            formControlName="adminParticipantId"
            placeholder="Enter admin participant ID"
            [class.p-invalid]="isFieldInvalid('adminParticipantId')"
          />
          <small class="error-message" *ngIf="isFieldInvalid('adminParticipantId')">
            {{ getFieldError('adminParticipantId') }}
          </small>
        </div>

        <div class="form-field">
          <label for="email">Email <span class="required">*</span></label>
          <input 
            pInputText 
            id="email" 
            formControlName="email"
            placeholder="Enter email address"
            [class.p-invalid]="isFieldInvalid('email')"
          />
          <small class="error-message" *ngIf="isFieldInvalid('email')">
            {{ getFieldError('email') }}
          </small>
        </div>

        <div class="form-field">
          <label for="firstName">First Name</label>
          <input 
            pInputText 
            id="firstName" 
            formControlName="firstName"
            placeholder="Enter first name"
            [class.p-invalid]="isFieldInvalid('firstName')"
          />
          <small class="error-message" *ngIf="isFieldInvalid('firstName')">
            {{ getFieldError('firstName') }}
          </small>
        </div>

        <div class="form-field">
          <label for="lastName">Last Name</label>
          <input 
            pInputText 
            id="lastName" 
            formControlName="lastName"
            placeholder="Enter last name"
            [class.p-invalid]="isFieldInvalid('lastName')"
          />
          <small class="error-message" *ngIf="isFieldInvalid('lastName')">
            {{ getFieldError('lastName') }}
          </small>
        </div>

        <div class="form-field">
          <label for="phone">Phone</label>
          <input 
            pInputText 
            id="phone" 
            formControlName="phone"
            placeholder="Enter phone number"
            [class.p-invalid]="isFieldInvalid('phone')"
          />
          <small class="error-message" *ngIf="isFieldInvalid('phone')">
            {{ getFieldError('phone') }}
          </small>
        </div>

        <div class="form-field">
          <label for="participantStatus">Participant Status</label>
          <p-select
            id="participantStatus"
            formControlName="participantStatus"
            [options]="participantStatuses"
            optionLabel="name"
            optionValue="id"
            placeholder="Select participant status"
            [showClear]="true"
            styleClass="w-full"
          ></p-select>
        </div>

        <div class="form-field">
          <label for="notes">Notes</label>
          <textarea 
            id="notes" 
            formControlName="notes"
            rows="5"
            placeholder="Enter notes (optional)"
            class="form-textarea"
          ></textarea>
        </div>

        <div class="form-actions">
          <p-button 
            label="Cancel" 
            icon="pi pi-times" 
            severity="secondary"
            type="button"
            (onClick)="onCancel()"
            [disabled]="isSubmitting"
          ></p-button>
          <p-button 
            label="Create" 
            icon="pi pi-check" 
            type="submit"
            [disabled]="isSubmitting"
            [loading]="isSubmitting"
          ></p-button>
        </div>
      </form>
    </div>
  </p-card>
</div>
