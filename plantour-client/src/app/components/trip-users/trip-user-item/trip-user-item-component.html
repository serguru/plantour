<span
    class="ic-2-item ellipsis-text"
    [innerHTML]="entity.fullName"
></span>
<a
    class="ic-2-item ic-2-right ellipsis-text"
    [href]="'mailto:'+entity.email"
>{{entity.email}}</a>

@if (entity.sharedAssignmentStatusText) {
<div class="smaller-text" [class]="statusToClassMap">{{entity.sharedAssignmentStatusText}}</div>
}

@if (entity.currentUserCanManageSharedAssignment) {
<div class="trip-user-actions">
    <button type="button" class="trip-user-action" (click)="onAcceptClick($event)">Accept</button>
    <button type="button" class="trip-user-action trip-user-action-secondary" (click)="onRejectClick($event)">Reject</button>
</div>
}

@if (lowerText.length && itemMetaData!.lowerTextVisible()) {
<div class="smaller-text">{{lowerText}}</div>
}
