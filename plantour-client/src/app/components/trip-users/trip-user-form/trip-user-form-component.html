<div class="page-container">
  <app-form-header
    [title]="title"
    icon="user"
  ></app-form-header>

  <div class="controls-wrapper">
    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
    >
      <div class="form-field">
        @if (isAddMode) {

        <label for="adminParticipantId">Traveler<span class="required">*</span></label>
        <p-select
          appAutoFocus
          class="w-full"
          [options]="lookupTravelers"
          optionLabel="fullName"
          optionValue="id"
          [placeholder]="isAddMode ? 'Select traveler' : ''"
          [showClear]="false"
          appendTo="body"
          (onChange)="onTravelerChange($event.value)"
          [readonly]="isViewMode"
          formControlName="adminParticipantId"
        >
        </p-select>
        @if (form.get('email')?.invalid && (form.get('email')?.touched || form.get('email')?.dirty)) {
        @if (form.get('email')?.errors?.['required']) {
        <small class="error-message">
          Email is required
        </small>
        }
        @if (form.get('email')?.errors?.['email']) {
        <small class="error-message">
          Please enter a valid email address
        </small>
        }
        }
        } @else {
        <label for="fullName">Traveler</label>
        <input
          pInputText
          id="fullName"
          type="text"
          formControlName="fullName"
          [readonly]="true"
        />
        }
      </div>

      <div class="form-field">
        <label for="email">Email</label>
        <input
          pInputText
          id="email"
          type="email"
          formControlName="email"
          [readonly]="true"
        />
      </div>

      <div class="form-field">
        <label for="firstName">First Name</label>
        <input
          pInputText
          id="firstName"
          type="text"
          formControlName="firstName"
          [readonly]="true"
        />
      </div>

      <div class="form-field">
        <label for="lastName">Last Name</label>
        <input
          pInputText
          id="lastName"
          type="text"
          formControlName="lastName"
          [readonly]="true"
        />
      </div>

      <div class="form-field">
        <label for="phone">Phone</label>
        <input
          pInputText
          id="phone"
          type="tel"
          formControlName="phone"
          [readonly]="true"
        />
      </div>

      <div class="form-field">
        <label for="notes">Notes</label>
        <textarea
          pTextarea
          id="notes"
          formControlName="notes"
          rows="5"
          [placeholder]="isAddMode ? 'Enter notes (optional)' : ''"
          [readonly]="isViewMode"
        ></textarea>
      </div>

      <app-form-actions
        [onCancel]="onCancel.bind(this)"
        cancelLabel="To trips"
        cancelIcon="chevron-left"
        [cancelDisabled]="false"
        [onSubmit]="!isViewMode ? onSubmit.bind(this) : null"
        submitLabel="Submit"
        submitIcon="save"
        [submitDisabled]="isLoading() || form.invalid"
      >
      </app-form-actions>
    </form>
  </div>
</div>
