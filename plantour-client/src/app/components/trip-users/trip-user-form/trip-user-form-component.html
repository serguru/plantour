<div class="page-container">
  <app-form-header
    [title]="title"
    icon="user"
    [menuItems]="menuItems()"
  ></app-form-header>

  <div class="controls-wrapper">
    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
    >
      <div class="form-field">
        @if (isAddMode) {

        <label for="adminParticipantId">Traveler<span class="required">*</span></label>
        <p-select
          appAutoFocus
          class="w-full"
          [options]="lookupTravelers"
          optionLabel="fullName"
          optionValue="id"
          [placeholder]="isAddMode ? 'Select traveler' : ''"
          [showClear]="false"
          appendTo="body"
          (onChange)="onTravelerChange($event.value)"
          [readonly]="isViewMode"
          formControlName="adminParticipantId"
        >
        </p-select>
        @if (form.get('email')?.invalid && (form.get('email')?.touched || form.get('email')?.dirty)) {
        @if (form.get('email')?.errors?.['required']) {
        <small class="error-message">
          Email is required
        </small>
        }
        @if (form.get('email')?.errors?.['email']) {
        <small class="error-message">
          Please enter a valid email address
        </small>
        }
        }
        } @else {
        <label for="fullName">Traveler</label>
        <input
          pInputText
          id="fullName"
          type="text"
          formControlName="fullName"
          [readonly]="true"
        />
        }
      </div>

      <div class="form-field">
        <label for="email">Email</label>
        <input
          pInputText
          id="email"
          type="email"
          formControlName="email"
          [readonly]="true"
        />
      </div>

      <div class="form-field">
        <label for="firstName">First Name</label>
        <input
          pInputText
          id="firstName"
          type="text"
          formControlName="firstName"
          [readonly]="true"
        />
      </div>

      <div class="form-field">
        <label for="lastName">Last Name</label>
        <input
          pInputText
          id="lastName"
          type="text"
          formControlName="lastName"
          [readonly]="true"
        />
      </div>

      <div class="form-field">
        <label for="phone">Phone</label>
        <input
          pInputText
          id="phone"
          type="tel"
          formControlName="phone"
          [readonly]="true"
        />
      </div>

      <div class="form-field">
        <div class="container">
          <p-checkbox
            formControlName="packagingComplete"
            [binary]="true"
            inputId="packagingComplete"
            [disabled]="isViewMode"
          />
          <label for="packagingComplete"> Packaging Complete </label>
        </div>
      </div>

      <div class="form-field">
        <label for="nopackWeightValue">No-pack Weight</label>
        <p-inputnumber
          inputId="nopackWeightValue"
          formControlName="nopackWeightValue"
          [placeholder]="isViewMode ? '' : 'Enter weight (optional)'"
          mode="decimal"
          locale="en-US"
          [min]="0"
          [maxFractionDigits]="3"
          [readonly]="isViewMode"
        />
      </div>

      <div class="form-field">
        <label for="nopackWeightUnit">No-pack Unit</label>
        <p-select
          id="nopackWeightUnit"
          formControlName="nopackWeightUnit"
          [options]="lookupUnits$ | async"
          [placeholder]="isViewMode ? '' : 'Select unit (optional)'"
          [showClear]="true"
          styleClass="w-full"
          [editable]="true"
          [readonly]="isViewMode"
        ></p-select>
      </div>

      <div class="form-field">
        <label for="notes">Notes</label>
        <textarea
          pTextarea
          id="notes"
          formControlName="notes"
          rows="5"
          [placeholder]="isAddMode ? 'Enter notes (optional)' : ''"
          [readonly]="isViewMode"
        ></textarea>
      </div>

      <div class="form-row two-columns">
        <div class="form-field">
          <label for="sharedAmount">Shared amount</label>
          <p-inputnumber
            inputId="sharedAmount"
            formControlName="sharedAmount"
            [placeholder]="isViewMode ? '' : 'Enter shared amount'"
            mode="decimal"
            locale="en-US"
            [min]="0"
            [maxFractionDigits]="2"
            [readonly]="isViewMode"
          />
        </div>

        <div class="form-field">
          <label for="assignedDeadline">Shared deadline</label>
          <input
            pInputText
            id="assignedDeadline"
            type="datetime-local"
            formControlName="assignedDeadline"
            [readonly]="isViewMode"
          />
        </div>
      </div>

      <app-form-actions
        [onCancel]="onCancel.bind(this)"
        cancelLabel="To trips"
        cancelIcon="chevron-left"
        [cancelDisabled]="false"
        [onSubmit]="!isViewMode ? onSubmit.bind(this) : null"
        submitLabel="Submit"
        submitIcon="save"
        [submitDisabled]="form.invalid"
      >
      </app-form-actions>
    </form>
  </div>
</div>
