
<div class="list-view-container">
  <div
    *ngFor="let item of items; trackBy: trackByFn"
    #listItem
    class="list-item"
    [class.selected]="isSelected(item)"
    (click)="selectItem(item)"
  >
    <ng-container 
      *ngTemplateOutlet="itemTemplate; context: { $implicit: item }">
    </ng-container>
  </div>
</div>
