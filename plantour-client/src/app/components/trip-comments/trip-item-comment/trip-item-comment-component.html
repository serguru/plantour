<div class="container" [class]="entity.isOwnComment ? 'sent' : 'received'">
    <div class="content">
        <div class="header">
            <div class="author">
                {{entity.fullUserName}}
            </div>
            <div class="date">
                {{entity.publishedAt}}
            </div>
        </div>
        <span
            [innerHTML]="entity.comment"
        ></span>
    </div>
</div>
