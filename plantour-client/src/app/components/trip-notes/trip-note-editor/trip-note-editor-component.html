<div class="trip-note-editor">
  <div class="trip-note-editor__hint">
    Plain text notes only. Existing rich formatting will be preserved until you edit and save the note.
  </div>
  <textarea
    class="trip-note-editor__surface"
    [readOnly]="readOnly"
    [value]="textValue"
    (input)="onTextInput(($any($event.target).value ?? '').toString())"
    placeholder="Write your note here"
  ></textarea>
</div>
