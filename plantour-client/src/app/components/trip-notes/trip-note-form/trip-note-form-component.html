<div class="page-container">
  <app-form-header [title]="title" icon="book"></app-form-header>

  <div class="controls-wrapper">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="title">Title<span class="required">*</span></label>
        <input appAutoFocus pInputText id="title" type="text" formControlName="title" placeholder="Enter note title" />

        @if (form.get('title')?.invalid && (form.get('title')?.touched || form.get('title')?.dirty)) {
          @if (form.get('title')?.errors?.['required']) {
          <small class="error-message">Title is required</small>
          }
        }
      </div>

      <div class="form-field">
        <label for="tripActivityId">Activity</label>
        <p-select
          id="tripActivityId"
          formControlName="tripActivityId"
          [options]="lookupActivities$ | async"
          optionLabel="name"
          optionValue="id"
          placeholder="Select activity (optional)"
          [showClear]="true"
          styleClass="w-full"
          appendTo="body"
        ></p-select>
      </div>

      <div class="form-field">
        <label>Content<span class="required">*</span></label>
        <app-trip-note-editor [contentJson]="contentJson" (contentJsonChange)="contentJson = $event"></app-trip-note-editor>
      </div>

      <app-form-actions
        [onCancel]="onCancel.bind(this)"
        cancelLabel="To trip notes"
        cancelIcon="chevron-left"
        [cancelDisabled]="false"
        [onSubmit]="onSubmit.bind(this)"
        submitLabel="Submit"
        submitIcon="save"
        [submitDisabled]="form.invalid"
      ></app-form-actions>
    </form>
  </div>
</div>
