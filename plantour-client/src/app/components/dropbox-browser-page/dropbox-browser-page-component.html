<div class="page-container">
  <app-entities-header
    entityIcon="pi pi-images"
    title="Browse Dropbox"
    entityName="Dropbox image"
    [headerButtons]="headerButtons()"
    [menuItems]="menuItems()"
    helpPageId="help/features/notes-and-images"
  ></app-entities-header>

  @if (browseResult?.currentPath) {
    <div class="dropbox-browser-page__path">{{ browseResult?.currentPath }}</div>
  }

  @if (loadError) {
    <div class="dropbox-browser-page__error">
      <div>{{ loadError }}</div>

      @if (missingDropboxKey) {
        <div class="dropbox-browser-page__error-links">
          <a [routerLink]="['/keys']">Open Keys</a>
          <span>or</span>
          <!-- TODO: add a dedicated help section for Dropbox image keys and replace this generic /help link. -->
          <a [routerLink]="['/help']">Help</a>
        </div>
      }
    </div>
  }

  <app-entities-actions></app-entities-actions>

  <app-entities [itemComponent]="itemComponent" [itemMetaData]="itemMetaData"></app-entities>
</div>
