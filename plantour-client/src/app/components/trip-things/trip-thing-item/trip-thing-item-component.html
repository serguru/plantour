<div class="pack-row">
    <span
        class="pack-name"
        [innerHTML]="entity.name"
    ></span>
    <p-select
        class="w-full"
        [options]="itemMetaData"
        optionLabel="name"
        optionValue="id"
        [(ngModel)]="entity.tripUserPackageId"
        [placeholder]="'Select package'"
        [ngModelOptions]="{ standalone: true }"
        [showClear]="true"
    >
    </p-select>

</div>
