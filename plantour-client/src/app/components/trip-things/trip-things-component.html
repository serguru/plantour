
<app-generic-list
    [service]="service"
    [fromDicService]="fromDicservice"
    [packingService]="packingService"
    [listActionsConfiguration]="configuration"
    [itemTemplate]="thingTemplate"
    title="Trip Things"
    entityIcon="pi-box"
    [isListReadOnly]="false"
    [addUrl]="'add'"
    [editUrl]="'edit/:id'"
    entityNameProp="name"
    entityName="trip thing"
    [toolBarButtons]="toolBarButtons"
    [useTripId]="true"
    [dic2trip]="false"
    [tripPanelVisible]="true"
    [thing2pack]="true"
>
</app-generic-list>

<ng-template
    #thingTemplate
    let-item
>
    <span
        class="list-name"
        [innerHTML]="item.name"
    ></span>
</ng-template>
