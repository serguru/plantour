<div class="page-container">
    <app-entities-header
        entityIcon="pi pi-objects-column"
        title="Trip items"
        [delete]="deleteTripThing.bind(this)"
        entityName="item"
        addUrl="add"
        editUrl="edit/:id"
        [menuItems]="menuItems()"
    ></app-entities-header>

    @if (usersService.isTemporarySignal()) {
    <div style="padding-top: 0.5rem; text-align: center;">
        <a href="/help/get-started/first-steps">help me add trip item</a>
    </div>
    }

    <app-entities-actions
        [onAddTargetClick]="onAddTargetClick.bind(this)"
        [onDeleteTargetClick]="onDeleteTargetClick.bind(this)"
    ></app-entities-actions>
    <app-entities
        [itemComponent]="tripThingItemComponent"
        [targetEntityClick]="targetEntityButtonClick.bind(this)"
        [itemMetaData]="itemMetaData"
    ></app-entities>
</div>
