<div class="page-container">
    <app-entities-header
        entityIcon="pi pi-objects-column"
        title="Trip things"
        [delete]="deleteTripThing.bind(this)"
        entityName="thing"
        entityNameProp="name"
        addUrl="add"
        editUrl="edit/:id"
    ></app-entities-header>

    <app-entities-actions
        [onAddTargetClick]="onAddTargetClick.bind(this)"
        [onDeleteTargetClick]="onDeleteTargetClick.bind(this)"
    ></app-entities-actions>
    <app-entities
        [itemComponent]="tripThingItemComponent"
        [targetEntityClick]="targetEntityButtonClick.bind(this)"
    ></app-entities>
</div>
