<div class="page-header">
  <div class="page-left">
    <i class="pi pi-sign-in"></i>
    <h2>Participant Sign In</h2>
  </div>
</div>
<div class="controls-wrapper">
  <form
    [formGroup]="signInForm"
    (ngSubmit)="onSubmit()"
  >

    <!-- Access Code Field -->
    <div class="form-field">
      <label for="accessCode">Access Code <span class="required">*</span></label>
      <p-password
        id="accessCode"
        formControlName="accessCode"
        placeholder="Enter your access code"
        [toggleMask]="true"
        [feedback]="false"
        [class.p-invalid]="isFieldInvalid('password')"
        styleClass="w-full"
      >
      </p-password>
      @if (isFieldInvalid('accessCode')) {
      <small class="error-message">
        {{ getFieldError('accessCode') }}
      </small>
      }
    </div>

    <!-- Error Message -->
    @if (errorMessage) {
    <div class="error-alert">
      <i class="pi pi-exclamation-triangle"></i>
      <span>{{ errorMessage }}</span>
    </div>
    }

    <!-- Form Actions -->
    <div class="form-actions">
      <p-button
        type="submit"
        label="Sign In"
        icon="pi pi-sign-in"
        [loading]="isLoading"
        [disabled]="isLoading || signInForm.invalid"
      >
      </p-button>
    </div>
    <div class="pale-prompt">
      Not registered?
      <button
        type="button"
        class="link-button"
        (click)="onSignUp()"
      >Sign Up as Admin here</button>
    </div>

  </form>
</div>
