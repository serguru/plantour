<div class="page-container">
    <app-entities-header
        entityIcon="pi pi-question-circle"
        title="Help"
        [headerButtons]="headerButtons()"
        [showHelpAction]="false"
        [useEntitiesActions]="false"
    ></app-entities-header>

    <div class="help-shell">
        <div class="help-version" aria-label="Application version">App version {{ appVersion }}</div>

        <section class="help-section-stack"> 
            @for (section of visibleSections(); track section.id; let isFirst = $first) {
                <details
                    [attr.id]="section.id"
                    class="help-page-card help-section-card help-faq-section"
                    [open]="isSectionExpanded(section.id, isFirst)"
                    (toggle)="onSectionToggle(section.id, $event)"
                >
                    <summary>
                        <div class="help-faq-section__heading">
                            <span class="help-section-card__title">{{ section.title }}</span>
                            <p class="help-faq-section__summary">{{ section.summary }}</p>
                        </div>
                        <span class="help-faq-section__arrow" aria-hidden="true"></span>
                    </summary>

                    <ol class="help-question-grid">
                        @for (question of section.questions; track question.pageId) {
                            <li>
                                <a class="help-question-card" [routerLink]="pageUrlById(question.pageId)">
                                    <span class="help-question-card__title">{{ question.question }}</span>
                                </a>
                            </li>
                        }
                    </ol>
                </details>
            }
         </section>
    </div>
</div>
