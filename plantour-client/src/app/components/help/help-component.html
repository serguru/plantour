<div class="page-container">

  <div class="page-header">
    <div class="page-left">
      <i class="pi pi-question-circle"></i>
      <h2>Help & Documentation</h2>
    </div>
    <div class="page-content">
    </div>
  </div>

  <div class="help-container">
    <div class="version">App version {{environment.version}}</div>
    <div class="help-header">
      <h1>Welcome to Plantour Help</h1>
      <p class="help-subtitle">
        Find everything you need to plan, organize, and execute your trips with confidence.
      </p>
    </div>

    <div class="help-sections">
      @for (section of helpSections(); track section.id) {
      <app-help-section
        [section]="section"
        [expanded]="expandedSectionId() === section.id"
        [selectedSubsectionId]="selectedSubsectionIdFor(section.id)"
        [subsectionComponents]="getSectionComponents(section.id)"
        (toggleExpanded)="toggleSection($event)"
        (selectSubsection)="handleSelectSubsection($event)"
        (startTestMode)="usersService.createTemporaryUser()"
      >
      </app-help-section>
      }

      <h3>
        Can't find what you're looking for? Ask as a question <a href="/contact">here</a>.
      </h3>
    </div>
  </div>
