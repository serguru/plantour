<div class="help-shell">
  <section class="help-answer-page">
    <article class="help-page-card help-page-card--answer">
      <div class="help-answer-toolbar">
        <a class="help-back-link" [routerLink]="homeUrl()">
          Back to Help
        </a>
      </div>

      <h1 class="help-answer-title">{{ currentPage().title }}</h1>
      <p class="help-page-summary">{{ currentPage().summary }}</p>

      @if (answerSpec(); as spec) {
        <ng-container *ngComponentOutlet="spec.component; inputs: spec.inputs"></ng-container>
      } @else {
        <p class="help-empty-state">No answer component is configured for this page.</p>
      }
    </article>
  </section>
</div>
