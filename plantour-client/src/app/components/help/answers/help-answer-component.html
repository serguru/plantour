<div class="help-shell">
  <section class="help-answer-page">
    <article class="help-page-card--answer">
      <div class="help-answer-heading">
        <a
          class="pl-button help-answer-back-button"
          [routerLink]="homeUrl()"
          [fragment]="backLinkFragment()"
          [attr.title]="backLinkLabel()"
          [attr.aria-label]="backLinkLabel()"
        >
          <span class="pi pi-chevron-left" aria-hidden="true"></span>
        </a>

        <h1 class="help-answer-title">{{ displayTitle() }}</h1>
      </div>

      @if (answerSpec(); as spec) {
        <ng-container *ngComponentOutlet="spec.component; inputs: spec.inputs"></ng-container>
      } @else {
        <p class="help-empty-state">No answer component is configured for this page.</p>
      }
    </article>
  </section>
</div>
