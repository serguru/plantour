<div class="list-container">
    @for (entity of processedEntities(); track entity.id) {
    <div
        class="item-container"
        [class.selected]="isSelected(entity)"
        (click)="selectEntity(entity)"
    >
        <div class="left">

            <ng-container *ngComponentOutlet="itemComponent; inputs: getEntityInputs(entity)">
            </ng-container>


        </div>
    </div>
    } @empty {
    <div>No rows</div>
    }
</div>
