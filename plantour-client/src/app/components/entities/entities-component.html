
<ul class="list-container">
    @for (entity of processedEntities | async; track entity.id) {
    <li
        class="item-container"
        [class.selected]="isSelected(entity)"
        (click)="selectEntity(entity)"
    >
        <div class="item-content">
            <ng-container *ngComponentOutlet="itemComponent; inputs: getEntityInputs(entity)">
            </ng-container>
        </div>

        @if(showEntityButton()) {
        <div class="target-button">
            <p-button
                [icon]="icon(entity)"
                (click)="onTargetEntityClick(entity, $event)"
                [rounded]="true"
                severity="secondary"
                [outlined]="true"
                [disabled]="entityButtonDisabled()"
            ></p-button>
        </div>
        }
    </li>

    } @empty {
    <div class="no-rows"><h2>{{emptyText()}}</h2></div>
    }
</ul>
