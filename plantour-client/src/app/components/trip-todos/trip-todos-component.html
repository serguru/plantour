<div class="page-container">
    <app-entities-header
        entityIcon="pi pi-check-square"
        title="Trip todos"

        entityName="todo"
        addUrl="add"
        editUrl="edit/:id"
        [menuItems]="menuItems()"

    <app-entities
        [itemComponent]="tripTodoItemComponent"
        [itemMetaData]="itemMetaData"
    ></app-entities>
</div>
