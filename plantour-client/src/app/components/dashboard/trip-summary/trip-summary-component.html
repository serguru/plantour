@if(tripData) {
<div class="page-container">
    <div class="dashboard">
        <section class="hero">
            <div class="hero-card">
                <div class="hero-top">
                    <div class="hero-title">
                        <div class="hero-label">{{`${tripIsCurrent ? "Current" : "Last "} trip`}} </div>
                        <h1>{{ tripData.name }}</h1>
                        <div class="hero-meta">
                            <i class="pi pi-map-marker"></i>
                            <span>{{ tripData.notes }}</span>
                                <!-- [severity]="trip.tripStatus" -->
                            <p-tag
                                [value]="tripData.tripStatus || undefined"
                                styleClass="status-tag"
                            ></p-tag>
                        </div>
                    </div>
                    <div class="hero-days">
                        <div class="hero-days-number">{{ tripData.daysLeft }}</div>
                        <div class="hero-days-label">{{tripData.daysLeftText}}</div>
                        <!-- <div class="hero-days-label">{{'Joppa'}}</div> -->
                        <div class="hero-days-label">{{tripData.fromTo}}</div>
                    </div>
                </div>

            </div>
        </section>
    </div>
</div>
}
