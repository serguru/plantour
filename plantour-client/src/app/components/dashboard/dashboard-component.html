<div class="page-container">
    <ul class="section">
        @for (item of items; track item.id) {
            <li
                class="item"
                [class.expanded]="expandedItemId === item.id"
                (click)="toggleItem(item.id)"
                role="button"
                tabindex="0"
                (keydown.enter)="toggleItem(item.id)"
                (keydown.space)="toggleItem(item.id)"
                [attr.aria-expanded]="expandedItemId === item.id"
            >
                <div class="item-header">
                    <div class="item-title-group">
                        <i [class]="item.icon" class="item-icon"></i>
                        <span class="item-title">{{ item.title }}</span>
                    </div>
                    <i [class]="expandedItemId === item.id ? 'pi pi-chevron-up' : 'pi pi-chevron-down'"></i>
                </div>

                @if (expandedItemId === item.id) {
                    <div class="item-content">
                        {{ item.description }}
                    </div>
                }
            </li>
        }
    </ul>
</div>
