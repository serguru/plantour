<div class="page-container">
    <app-entities-header
        entityIcon="pi pi-shopping-bag"
        title="Bags"
        [delete]="deletePack.bind(this)"
        entityName="bag"
        
        addUrl="add"
        editUrl="edit/:id"
    ></app-entities-header>

    <app-entities-actions
        [onAddTargetClick]="onAddTargetClick.bind(this)"
        [onDeleteTargetClick]="onDeleteTargetClick.bind(this)"
    ></app-entities-actions>
    <app-entities
        [itemComponent]="packItemComponent"
        [targetEntityClick]="targetEntityButtonClick.bind(this)"
    ></app-entities>
</div>
