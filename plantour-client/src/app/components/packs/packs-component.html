<app-generic-list
    [service]="service"
    [listActionsConfiguration]="configuration"
    [itemTemplate]="packTemplate"
    title="Packs"
    entityIcon="pi-briefcase"
    [isListReadOnly]="false"
    [addUrl]="'packs/add'"
    [editUrl]="'packs/edit/:id'"
    entityNameProp="name"
    entityName="package"
>
</app-generic-list>

<ng-template
    #packTemplate
    let-item
>
    <div class="list-item">
        <span
            class="list-name"
            [innerHTML]="item.name"
        ></span>
    </div>
    <!-- <textarea readonly rows="4" cols="50">{{ item.description }}</textarea> -->
</ng-template>
