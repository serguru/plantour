<app-base-form
  [service]="service"
  [fieldsConfig]="fieldsConfig"
  [formTemplate]="fieldsTemplate"
  mode="add"
  title="Add pack"
  entityIcon="pi-briefcase"
>
</app-base-form>

<ng-template
  #fieldsTemplate
  let-form="form"
  let-onSubmit="onSubmit"
>
  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
  >
    <div class="form-field">
      <label for="name">Name<span class="required">*</span></label>
      <input
        pInputText
        id="name"
        type="text"
        formControlName="name"
        placeholder="Enter pack name"
      />
      @if (form.get('name')?.invalid && (form.get('name')?.touched || form.get('name')?.dirty) ) {
        @if (form.get('name')?.errors?.['required']) {
        <small class="error-message">
          Name is required
        </small>
        }
      }
    </div>
  </form>
</ng-template>
