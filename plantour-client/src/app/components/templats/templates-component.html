<div class="page-container">
    <app-entities-header
        entityIcon="pi pi-objects-column"
        title="Template things"
        entityName="template thing"
        [menuItems]="menuItems()"
    ></app-entities-header>

    <app-entities-actions
        [onAddTargetClick]="onAddTargetClick.bind(this)"
        [onDeleteTargetClick]="onDeleteTargetClick.bind(this)"
    ></app-entities-actions>
    <app-entities
        [itemComponent]="templateItemComponent"
        [targetEntityClick]="targetEntityClick.bind(this)"
        [itemMetaData]="itemMetaData"
    ></app-entities>
</div>
