<div class="container">
  <div
    class="row"
    [innerHTML]="entity.name"
  ></div>

  <div class="row">
    <div>
      @if (entity.category) {
      <p-tag
        [value]="entity.category"
        severity="secondary"
        [style]="{  'font-size': 'large' }"
      >
      </p-tag>
      }
    </div>
    <div>
      {{entity.activityName}}
    </div>
  </div>
</div>
