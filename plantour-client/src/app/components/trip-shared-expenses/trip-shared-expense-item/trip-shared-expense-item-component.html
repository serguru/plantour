<div class="container">
  <div class="expense-copy">
    <amazon-link
      class="ic-2-item ellipsis-text"
      [item]="entity.name"
      [linkText]="entity.name"
    ></amazon-link>

    @if (categoryText) {
      <div class="smaller-text category-text">{{ categoryText }}</div>
    }

    @if (entity.notes) {
      <div class="smaller-text">{{ entity.notes }}</div>
    }
  </div>

  <div class="ic-2-item ic-2-right amount-text">{{ amountText }}</div>
</div>
