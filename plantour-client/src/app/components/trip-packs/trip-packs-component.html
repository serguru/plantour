
<app-generic-list
    [service]="service"
    [fromDicService]="fromDicservice"
    [listActionsConfiguration]="configuration"
    [itemTemplate]="packTemplate"
    title="Trip Packs"
    entityIcon="pi-briefcase"
    [isListReadOnly]="false"
    [addUrl]="'add'"
    [editUrl]="'edit/:id'"
    entityNameProp="name"
    entityName="trip package"
    [toolBarButtons]="toolBarButtons"
    [useTripId]="true"
    [dic2trip]="false"
    [tripPanelVisible]="true"
>
</app-generic-list>

<ng-template
    #packTemplate
    let-item
>
    <span
        [innerHTML]="item.name"
    ></span>
</ng-template>
