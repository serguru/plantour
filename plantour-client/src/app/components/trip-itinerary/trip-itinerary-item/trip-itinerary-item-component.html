<div class="container">
  <span class="ic-2-item ellipsis-text">{{ entity.name }}</span>

  @if (entity.category) {
  <span class="ic-2-item ic-2-right ellipsis-text">
    <span class="category">{{ entity.category }}</span>
  </span>
  }
</div>

@if (lowerText.length && itemMetaData?.lowerTextVisible?.()) {
<div class="smaller-text">
  {{ lowerText }}
</div>
}
