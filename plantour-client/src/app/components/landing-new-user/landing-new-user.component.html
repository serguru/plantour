<div class="landing-container">
  <header class="hero">
    <div class="header-container">
      <h1 class="slogan">Plan smart.</h1>
      <h1 class="slogan">Travel better.</h1>
    </div>
    <p class="sub-slogan">{{ subSlogan }}</p>
  </header>

  <section class="features-section">
    <h2>Why Plantour?</h2>
    <div class="features-grid">
      @for (feature of featureList; track feature.title) {
      <article class="feature-card">
        <div class="icon-container">
          <span [class]="'pi pi-' + feature.icon"></span>
          <h3 class="feature-title">{{ feature.title }}</h3>
        </div>
        <p class="feature-desc">{{ feature.description }}</p>
      </article>
      }
    </div>
  </section>

  <section class="try">
    <div class="try-section">
      <div class="try-card">
        <button class="try-button" (click)="usersService.createTemporaryUser()">Try packing your items for the trip</button>
        <h3>No registration required</h3>
        <h3>Prefilled test data is ready</h3>
      </div>
    </div>
  </section>

  <ng-container *ngComponentOutlet="plansPanelComponent"></ng-container>
</div>
