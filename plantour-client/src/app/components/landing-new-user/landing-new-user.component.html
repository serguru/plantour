<div class="landing-container">
  <header class="header">
    <nav class="nav">
      <span class="logo">Plantour</span>
    </nav>
  </header>
  

  <main>
    <section class="hero">
      <h1>Pack Smart. Travel Better.</h1>
      <p class="description">
        Never forget an item again. Organize your travel packing with smart lists, 
        item categories, and seamless team collaboration.
      </p>
      <button class="btn-primary">Get Started, No Account Needed</button>
    </section>

    <section class="pricing-section">
      <div class="pricing-grid">
        <div *ngFor="let plan of plans" class="card" [class.featured]="plan.highlight">
          <div *ngIf="plan.highlight" class="badge">Most Popular</div>
          <h3>{{ plan.name }}</h3>
          <div class="price">
            <span class="amount">{{ plan.price }}</span>
            <span class="period">/{{ plan.period }}</span>
          </div>
          <ul class="features">
            <li *ngFor="let feature of plan.features">
              <span class="check">✓</span> {{ feature }}
            </li>
          </ul>
          <button class="cta-button">{{ plan.cta }}</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
  </footer>
</div>
