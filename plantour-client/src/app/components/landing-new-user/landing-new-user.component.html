<div class="landing-container">
  <header class="hero">
    <div class="header-container">
      <h1 class="slogan">
        <span>Plan less.</span>
        <span>Travel more.</span>
      </h1>
    </div>
    <p class="sub-slogan">{{ subSlogan }}</p>
  </header>

  <section class="features-section">
    <h2>Everything you need to plan a trip</h2>
    <div class="features-grid">
      @for (feature of featureList; track feature.title) {
      <article class="feature-card">
        <div class="icon-container">
          <span [class]="'pi pi-' + feature.icon"></span>
          <h3 class="feature-title">{{ feature.title }}</h3>
        </div>
        <p class="feature-desc">{{ feature.description }}</p>
      </article>
      }
    </div>
  </section>

  <section class="try">
    <div class="try-section">
      <div class="try-card">
        <button class="try-button" (click)="usersService.createTemporaryUser()">Open a sample trip</button>
        <h3>No registration required</h3>
        <h3>Start with a ready-made sample trip</h3>
      </div>
    </div>
  </section>

  <ng-container *ngComponentOutlet="plansPanelComponent"></ng-container>
</div>
