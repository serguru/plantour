<app-content-layout>
  <div class="page-header">
    <div class="header-left">
      <i
        class="pi"
        [class]="entityIcon"
      ></i>
      <h2>{{ title }}</h2>
    </div>
    <div class="header-right">
      @if(!isListReadOnly) {
      <!-- no format -->
        @if(addUrl) {
          <p-button
            icon="pi pi-plus"
            (click)="onAdd()"
            [rounded]="true" 
            [text]="true"
            />
        }
        @if(editUrl) {
          <p-button
            icon="pi pi-pencil"
            (click)="onEdit()"
            [disabled]="!selected"     
            [rounded]="true" 
            [text]="true"
            />
        }
        <p-button
          icon="pi pi-trash"
          (click)="onDelete()"
          [disabled]="!selected"     
          [rounded]="true" 
          [text]="true"
            />
      <!-- no format -->
      }
    </div>
  </div>

  <app-list-actions
    [items]="entities"
    [config]="listActionsConfiguration"
    (listChanged)="onEntitiesChanged($event)"
  >
  </app-list-actions>

<app-list-box
  [items]="processedEntities || []"
  [(selected)]="selected"
></app-list-box>

  <div
    class="empty-state"
    [hidden]="processedEntities && processedEntities.length"
  >
    <i
      class="pi"
      [class]="entityIcon"
    ></i>
    <p>No rows</p>
  </div>

</app-content-layout>
