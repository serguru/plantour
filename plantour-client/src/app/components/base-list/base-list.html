<app-content-layout>
  <div class="page-header">
    <div class="header-left">
      <i
        class="pi"
        [class]="entityIcon"
      ></i>
      <h2>{{ title }}</h2>
    </div>

    <div class="header-right">
      @if(!isListReadOnly) {
      <!-- no format -->
        @if(dic2trip) {
          <p-button
            [text]="true"
            [rounded]="true"
          >
            <i
              class="pi pi-compass"
              pButtonIcon
              [ngClass]="dic2tripVisible ? 'icon-green':null"
              (click)="onToggleTrip()"
            ></i>
          </p-button>
        }
        @if(addUrl) {
          <p-button
            icon="pi pi-plus"
            (click)="onAdd()"
            [rounded]="true" 
            [text]="true"
            />
        }
        @if(editUrl) {
          <p-button
            icon="pi pi-pencil"
            (click)="onEdit()"
            [disabled]="!selected"     
            [rounded]="true" 
            [text]="true"
            />
        }
        <p-button
          icon="pi pi-trash"
          (click)="onDelete()"
          [disabled]="!selected"     
          [rounded]="true" 
          [text]="true"
            />
      <!-- no format -->
      }
    </div>
  </div>

  @if (dic2tripVisible) {
  <app-dic-trip
    (selectedTripChanged)="onSelectedTripChanged($event)"
    (registerGetter)="setCheckSelectedTrip($event)"
    [entitiesToDisplay]="entitiesToDisplay"
    [addFromDic]="addFromDic.bind(this)"
    [deleteFromDic]="deleteFromDic.bind(this)"
    [tripsFor]="tripsFor"
  ></app-dic-trip>
  }
  @if (tripPanelVisible && tripId) {
    <app-trip-panel [tripId]="tripId"></app-trip-panel>
  }




  <app-list-actions
    [items]="entities"
    [config]="listActionsConfiguration"
    (listChanged)="onEntitiesChanged($event)"
  >
  </app-list-actions>

  <app-list-box
    [items]="entitiesToDisplay.list || []"
    [itemTemplate]="itemTemplate"
    (selectedChange)="onSelectedChange($event)"
    (addRemoveFromDic)="onAddRemoveFromDic($event)"
    [dic2tripVisible]="dic2tripVisible"
  ></app-list-box>


  @if (!processedEntities || processedEntities.length === 0) {
  <div class="empty-state">
    <i
      class="pi"
      [class]="entityIcon"
    ></i>
    <p>No rows</p>
  </div>
  }
</app-content-layout>
