<app-content-layout>
  <div class="page-header">
    <div class="header-left">
      <i class="pi" [class]="entityIcon"></i>
      <h2>{{title}}</h2>
    </div>
    <div class="header-right">
      @if (listNotEmpty) {
      @if(!listToolsShown) {<i class="pi pi-filter"></i>}
      @if(listToolsShown) {<i class="pi pi-filter-slash"></i>}
      }
      <i class="pi pi-plus"></i>
      <i class="pi pi-pencil"></i>
      <i class="pi pi-trash"></i>
    </div>
  </div>

  @if (processedEntities && processedEntities!.length > 0) {
  <p-listbox [options]="processedEntities!" [(ngModel)]="selected" optionLabel="name"
    [listStyle]="{'max-height': '60vh'}" styleClass="w-full">
  </p-listbox>
  } @else {
  <div class="empty-state">
    <i class="pi" [class]="entityIcon"></i>
    <p>No rows yet</p>
  </div>
  }
</app-content-layout>
