<app-content-layout>
  <div class="page-header">
    <div class="header-left">
      <i class="pi" [class]="entityIcon"></i>
      <h2>{{title}}</h2>
    </div>
    <div class="header-right">
      @if(!listToolsShown) {<i class="pi pi-filter" (click)="showListActions()" [class.has-dot]="isAnyFeatureActive"></i>}
      @if(listToolsShown) {<i class="pi pi-filter-slash" (click)="hideListActions()" [class.has-dot]="isAnyFeatureActive"></i>}
      <i class="pi pi-plus"></i>
      <i class="pi pi-pencil"></i>
      <i class="pi pi-trash"></i>
    </div>
  </div>

  <app-list-actions [items]="entities" [config]="listActionsConfiguration" [listToolsShown]="listToolsShown"
    (listChanged)="onEntitiesChanged($event)">
  </app-list-actions>

  @if (processedEntities && processedEntities.length > 0) {
  <p-listbox id="base-list-listbox" [options]="processedEntities!" [(ngModel)]="selected">
    <ng-template pTemplate="item" let-item>
      <ng-container *ngTemplateOutlet="itemTemplate; context: { $implicit: item }"></ng-container>
    </ng-template>
  </p-listbox>
  } @else {
  <div class="empty-state">
    <i class="pi" [class]="entityIcon"></i>
    <p>No rows</p>
  </div>
  }
</app-content-layout>
