@if (!hideTripPanel) {
<div class="container">
    @if(tripDto) {
    <h3 class="left">
        <a [href]="tripUrl">
            {{tripDto.name}}
        </a>
    </h3>

    <h4  class="right">Participants: {{tripDto.totalParticipants}}</h4>


    } @else {
    <h4>No trip found</h4>
    }
</div>
}
