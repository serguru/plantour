<div class="page-container">
  <app-entities-header
    entityIcon="pi pi-search"
    title="Search"
    [menuItems]="menuItems()"
    [useEntitiesActions]="false"
  ></app-entities-header>

  <div class="search-page">
    <div class="search-controls">
      <div class="search-controls__box">
        <input
          id="plantour-search-query"
          type="text"
          [ngModel]="searchInput()"
          (ngModelChange)="onSearchInput($event)"
          name="searchQuery"
          placeholder="Type to search..."
        />
      </div>
    </div>

    <div class="search-results" [class.search-results--idle]="!searchQuery()">
      @if (searchQuery()) {
        <div class="search-results__summary">
          <p>{{ searchResults().length }} result(s) matched "{{ searchQuery() }}".</p>
          @if (isLoading()) {
            <p class="search-results__loading">Loading dynamic public template results...</p>
          }
        </div>

        @if (searchResults().length > 0) {
          <div class="search-results__grid">
            @for (result of searchResults(); track result.document.id) {
              <a class="search-result-card" [routerLink]="result.document.url">
                <span class="search-result-card__title" [innerHTML]="result.titleHtml"></span>
                <span class="search-result-card__crumbs" [innerHTML]="result.breadcrumbHtml"></span>
                <span class="search-result-card__summary" [innerHTML]="result.summaryHtml"></span>
                <span class="search-result-card__url" [innerHTML]="result.urlHtml"></span>
              </a>
            }
          </div>
        }
      }
    </div>
  </div>
</div>
