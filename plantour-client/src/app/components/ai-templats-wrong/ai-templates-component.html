<div class="page-container">
    <app-entities-header
        entityIcon="pi pi-sparkles"
        title="AI templates"
        entityName="ai template item"
        [menuItems]="menuItems()"
    ></app-entities-header>

    <div class="ai-prompt">
        <input
            pInputText
            type="text"
            [(ngModel)]="promptText"
            placeholder="Describe your trip (e.g., I am going for skiing to Alps next weekend)"
            (keydown.enter)="onAskAi()"
            [disabled]="loading()"
        />
        <app-button
            label="Ask AI"
            icon="pi pi-bolt"
            (click)="onAskAi()"
            [disabled]="loading() || !promptText.trim()"
        ></app-button>
    </div>

    <app-entities-actions
        [onAddTargetClick]="onAddTargetClick.bind(this)"
        [onDeleteTargetClick]="onDeleteTargetClick.bind(this)"
    ></app-entities-actions>
    <app-entities
        [itemComponent]="aiTemplateItemComponent"
        [targetEntityClick]="targetEntityClick.bind(this)"
        [itemMetaData]="itemMetaData"
    ></app-entities>
</div>
