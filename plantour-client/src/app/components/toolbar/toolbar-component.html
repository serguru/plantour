<div class="page-header">
  <div class="header-left">
    <div
      class="logo-container"
      (click)="onLogoClick()"
    >
      <img
        src="assets/plantour-logo.png"
        alt="Plantour Logo"
        class="logo-image"
      />
      <!-- <span class="app-title">Plantour</span> -->
      <h2 class="ellipsis-text">Plantour</h2>
    </div>
  </div>

  <div class="header-middle">

    @if(dynamicButtons?.length) {
      @for (button of dynamicButtons; track $index) {
      <button
        pButton
        [icon]="button.icon"
        [label]="button.label || ''"
        [pTooltip]="button.tooltip || ''"
        [disabled]="button.disabled || false"
        class="p-button-text p-button-rounded dynamic-button"
        (click)="button.command()"
        [attr.aria-label]="button.tooltip || button.label || 'Action'"
      >
      </button>
      }
    }

    @if(dynamicMenus?.length) {
    <button
      pButton
      icon="pi pi-ellipsis-v"
      class="p-button-text p-button-rounded menu-button"
      (click)="dynamicMenu.toggle($event)"
    >
    </button>
    <p-menu
      #dynamicMenu
      [model]="dynamicMenus || []"
      [popup]="true"
      styleClass="toolbar-popup-menu"
    ></p-menu>
    }
  </div>

  <div class="header-right">
    <button
      pButton
      icon="pi pi-bars"
      class="p-button-text p-button-rounded menu-button"
      (click)="menu.toggle($event)"
    >
    </button>
    <p-menu
      #menu
      [model]="menuItems"
      [popup]="true"
      styleClass="toolbar-popup-menu"
    ></p-menu>
  </div>
</div>
