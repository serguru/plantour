<div class="view-header">
  <div class="view-left">
    <div
      class="logo-container"
      (click)="onLogoClick()"
    >
      <img
        src="assets/plantour-logo.png"
        alt="Plantour Logo"
        class="logo-image"
      />
      <!-- <span class="app-title">Plantour</span> -->
      <h2 class="ellipsis-text">Plantour</h2>
    </div>
  </div>


  <div class="view-content">

    <!-- @if(backUrl) {
      <button
        class="pl-button"
        (click)="navigateBack()"
      >
        <span class="pi pi-chevron-left"></span>
        <span class="button-label">Back</span>
      </button>
    } -->


    <button
      class="pl-button"
      (click)="onDashboardClick($event)"
    >
      <span class="pi pi-chart-bar"></span>
      <span class="button-label">Dashboard</span>
    </button>


    <button
      class="pl-button"
      (click)="popoverDic.toggle($event)"
    >
      <span class="pi pi-clone"></span>
      <span class="button-label">Dictionary</span>
    </button>
    <p-popover
      #popoverDic
      styleClass="no-arrow"
    >
      <nav class="pl-menu-container">
        <a
          class="pl-menu-item"
          [class.selected]="isNavigatedComponent('travelers')"
          (click)="onTravelersClick($event, popoverDic)"
        >
          <span class="pi pi-compass"></span>
          <span class="button-label">Travelers</span>
        </a>
        <a
          class="pl-menu-item"
          [class.selected]="isNavigatedComponent('things')"
          (click)="onThingsClick($event, popoverDic)"
        >
          <span class="pi pi-objects-column"></span>
          <span class="button-label">Things</span>
        </a>
        <a
          class="pl-menu-item"
          [class.selected]="isNavigatedComponent('packs')"
          (click)="onPacksClick($event, popoverDic)"
        >
          <span class="pi pi-box"></span>
          <span class="button-label">Packs</span>
        </a>


      </nav>
    </p-popover>

    <button
      class="pl-button"
      (click)="popoverTrip.toggle($event);"
    >
      <span class="pi pi-compass"></span>
      <span class="button-label">Trip</span>
    </button>
    <p-popover
      #popoverTrip
      styleClass="no-arrow"
    >
      <nav class="pl-menu-container">
        <a
          class="pl-menu-item"
          [class.selected]="isNavigatedComponent('trips')"
          (click)="onTripsClick($event)"
        >
          <span class="pi pi-compass"></span>
          <span class="button-label">Trips</span>
        </a>
        <a
          class="pl-menu-item"
          [class.selected]="isNavigatedComponent('trip-participants')"
          (click)="onTripParticipantsClick($event)"
          [class.disabled]="!isCurrentTrip"
        >
          <span class="pi pi-users"></span>
          <span class="button-label">Participants</span>
        </a>
        <a
          class="pl-menu-item"
          [class.selected]="isNavigatedComponent('trip-things')"
          (click)="onTripThingsClick($event)"
          [class.disabled]="!isCurrentTrip"
        >
          <span class="pi pi-objects-column"></span>
          <span class="button-label">Things</span>
        </a>
        <a
          class="pl-menu-item"
          [class.selected]="isNavigatedComponent('trip-packs')"
          (click)="onTripPacksClick($event)"
          [class.disabled]="!isCurrentTrip"
        >
          <span class="pi pi-box"></span>
          <span class="button-label">Packs</span>
        </a>
        <a
          class="pl-menu-item"
          [class.selected]="isNavigatedComponent('trip-shared')"
          (click)="onTripSharedClick($event)"
          [class.disabled]="!isCurrentTrip"
        >
          <span class="pi pi-link"></span>
          <span class="button-label">Shared</span>
        </a>


      </nav>
    </p-popover>

    <button
      class="pl-button"
      [disabled]="false"
      (click)="popoverFeatures.toggle($event)"
    >
      <span class="pi pi-bars"></span>
      <span class="button-label">Features</span>
    </button>
    <p-popover
      #popoverFeatures
      styleClass="no-arrow"
    >
      @for (item of featuresMenuItems; track item.label) {
      <div class="menu-item-container">
        <span [class]="item.icon"></span>
        <span>{{item.label}}</span>
      </div>
      }
    </p-popover>



  </div>
</div>
