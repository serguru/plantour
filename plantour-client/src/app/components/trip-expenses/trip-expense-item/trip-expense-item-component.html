<div class="container">
  <div class="expense-copy">
    <amazon-link
      class="ic-2-item ellipsis-text"
      [item]="entity.name"
      [linkText]="entity.name"
    ></amazon-link>

    @if (secondaryText && itemMetaData?.lowerTextVisible?.()) {
      <div class="smaller-text meta-text">{{ secondaryText }}</div>
    }
  </div>

  <div class="ic-2-item ic-2-right amount-text">{{ amountText }}</div>
</div>
@if (itemMetaData?.assignmentsVisible()) {
  <div
    class="smaller-text"
    [class]="statusToClassMap"
  >{{ entity.assignmentStatusText }}</div>
}
