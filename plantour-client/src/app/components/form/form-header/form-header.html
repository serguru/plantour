<div class="page-header">
    <div class="page-left">
        <i
            class="pi"
            [class]="'pi-' + icon()"
        ></i>
        <h2 class="ellipsis-text">{{ title() }}</h2>
    </div>
    <div class="page-right">
        @if(resolvedMenuItems().length) {
            <button
                class="pl-button"
                type="button"
                (click)="popover.toggle($event)"
            >
                <span class="pi pi-ellipsis-v"></span>
            </button>
            <p-popover
                #popover
                styleClass="no-arrow"
            >
                @for(item of resolvedMenuItems(); track item.label) {
                    <div
                        class="pl-menu-item"
                        (click)="item.action(); popover.hide()"
                    >
                        <span [class]="'pi pi-' + item.icon"></span>
                        <span class="button-label">{{ item.label }}</span>
                    </div>
                }
            </p-popover>
        }
    </div>
</div>
