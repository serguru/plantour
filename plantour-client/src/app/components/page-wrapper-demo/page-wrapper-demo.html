<app-content-layout>
  <div class="demo-container">
    <!-- List View -->
    @if (viewMode() === 'list') {
      <app-page-wrapper 
        pageIcon="pi pi-box"
        pageTitle="My Items"
        [actions]="listActions">
        <app-list-wrapper>
          @if (items.length > 0) {
            <div class="item-list">
              @for (item of items; track item.id) {
                <div 
                  class="list-item"
                  [class.selected]="selectedItem?.id === item.id"
                  (click)="onSelectItem(item)">
                  <div class="item-main">
                    <div class="item-title">{{ item.name }}</div>
                    <div class="item-category">{{ item.category }}</div>
                  </div>
                  @if (item.description) {
                    <div class="item-description">{{ item.description }}</div>
                  }
                </div>
              }
            </div>
          } @else {
            <div class="empty-state">
              <i class="pi pi-inbox"></i>
              <p>No items yet</p>
              <p class="hint">Click the + button to add your first item</p>
            </div>
          }
        </app-list-wrapper>
      </app-page-wrapper>
    }

    <!-- Form View -->
    @if (viewMode() === 'form') {
      <app-page-wrapper 
        pageIcon="pi pi-plus"
        pageTitle="Add New Item"
        [actions]="formActions">
        <app-controls-wrapper>
          <form (ngSubmit)="onSubmitForm()" class="demo-form">
            <div class="form-field">
              <label for="name">Name <span class="required">*</span></label>
              <input 
                pInputText 
                id="name"
                [(ngModel)]="formName"
                name="name"
                placeholder="Enter item name"
                required />
            </div>

            <div class="form-field">
              <label for="category">Category</label>
              <p-select
                id="category"
                [(ngModel)]="formCategory"
                name="category"
                [options]="categories"
                placeholder="Select category"
                [showClear]="true"
                styleClass="w-full">
              </p-select>
            </div>

            <div class="form-field">
              <label for="description">Description</label>
              <textarea
                id="description"
                [(ngModel)]="formDescription"
                name="description"
                rows="4"
                placeholder="Enter description (optional)"
                class="form-textarea"></textarea>
            </div>

            <div class="form-actions">
              <p-button
                label="Cancel"
                icon="pi pi-times"
                severity="secondary"
                type="button"
                (onClick)="switchToList()">
              </p-button>
              <p-button
                label="Add Item"
                icon="pi pi-check"
                type="submit"
                [disabled]="!formName">
              </p-button>
            </div>
          </form>
        </app-controls-wrapper>
      </app-page-wrapper>
    }
  </div>
</app-content-layout>
