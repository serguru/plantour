<app-base-form
  [service]="service"
  [fieldsConfig]="fieldsConfig"
  [formTemplate]="fieldsTemplate"
  [mode]="mode"
  entityIcon="pi-objects-column"
  entityName="thing"
  [id]="id"
  backUrl="/things"
  [toolBarButtons]="this.toolBarButtons"
>
</app-base-form>



<ng-template
  #fieldsTemplate
  let-form="form"
  let-thingCategories="thingCategories$"
  let-units="units$"
  let-onSubmit="onSubmit"
>
  <div class="controls-wrapper">
    <form [formGroup]="form">
      <div class="form-field">
        <label for="name">Name<span class="required">*</span></label>
        <input
          pInputText
          id="name"
          type="text"
          formControlName="name"
          placeholder="Enter thing name"
        />
        @if (form.get('name')?.invalid && (form.get('name')?.touched || form.get('name')?.dirty) ) {
        @if (form.get('name')?.errors?.['required']) {
        <small class="error-message">
          Name is required
        </small>
        }
        }
      </div>

      <div class="form-field">
        <label for="category">Category</label>
        <p-select
          id="category"
          formControlName="category"
          [options]="thingCategories | async"
          optionLabel="name"
          optionValue="name"
          placeholder="Select category"
          [showClear]="true"
          styleClass="w-full"
          [editable]="true"
        ></p-select>
      </div>

      <div class="form-field">
        <label for="value">Value</label>
        <input
          pInputText
          id="value"
          type="text"
          formControlName="value"
          placeholder="Enter value (optional)"
        />
      </div>

      <div class="form-field">
        <label for="units">Units</label>
        <p-select
          id="units"
          formControlName="units"
          [options]="units | async"
          optionLabel="name"
          optionValue="name"
          placeholder="Select unit"
          [showClear]="true"
          styleClass="w-full"
          [editable]="true"
        ></p-select>
      </div>

      <div class="form-field">
        <label for="notes">Notes</label>
        <textarea
          pTextarea
          id="notes"
          formControlName="notes"
          rows="5"
          placeholder="Enter notes (optional)"
        ></textarea>
      </div>

      @if(useService.isAdmin) {
      <div class="form-field">
        <!-- <label for="common">Common use</label>
          <input
            id="common"
            type="checkbox"
            formControlName="common"
          /> -->


        <div class="checkbox-container">
          <p-checkbox
            formControlName="common"
            [binary]="true"
            inputId="common"
          >
          </p-checkbox>
          <label for="common">Common use</label>
        </div>

      </div>
      }
    </form>
  </div>
</ng-template>
