<app-generic-list
  [service]="service"
  [listActionsConfiguration]="configuration"
  [itemTemplate]="thingTemplate"
  title="Things"
  entityIcon="pi-objects-column"
  [isListReadOnly]="false"
  [addUrl]="'things/add'"
  [editUrl]="'things/edit/:id'"
  entityNameProp="name"
  entityName="thing"
  [toolBarButtons]="toolBarButtons"

>
</app-generic-list>

<ng-template
  #thingTemplate
  let-item
>
  <span
    class="list-name"
    [innerHTML]="item.name"
  ></span>
</ng-template>
