name: Versioning and Deployment Sync

on:
  pull_request:
    branches:
      - qa
    types: [closed]

jobs:
  tag-and-stamp:
    # Only run if the PR was actually merged, not just closed
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push the version change back to your repo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: qa # Ensure we are working on the target branch

      # 1. Calculate the next version based on commit messages
      - name: Calculate Next Version
        id: tag_action
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      # 2. Update Angular environment file
      - name: Update Angular Version
        run: |
          sed -i "s/version: '0.0.0'/version: '${{ steps.tag_action.outputs.new_tag }}'/g" src/environments/environment.ts

      # 3. Update .NET .csproj version
      - name: Update .NET Version
        run: |
          sed -i "s|<Version>0.0.0</Version>|<Version>${{ steps.tag_action.outputs.new_tag }}</Version>|g" plantour-server/*.csproj

      # 4. Commit the changes back to the 'qa' branch
      # This is what Render will see and trigger the deployment
      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/environments/environment.ts plantour-server/*.csproj
          git commit -m "chore: bump version to ${{ steps.tag_action.outputs.new_tag }} [skip ci]"
          git push origin qa

      # 5. Create the official GitHub Release
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag_action.outputs.new_tag }}
          release_name: Release ${{ steps.tag_action.outputs.new_tag }}
          body: ${{ steps.tag_action.outputs.changelog }}