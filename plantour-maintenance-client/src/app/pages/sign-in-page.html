<section class="sign-in-layout">
  <form class="sign-in-card" [formGroup]="signInForm" (ngSubmit)="submitSignIn()">
    <div class="card-heading">
      <h2>Please sign in</h2>
    </div>

    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="username" placeholder="you@plantour.app" />
      @if (signInForm.controls.email.invalid && signInForm.controls.email.touched) {
        <small>Please enter a valid email address.</small>
      }
    </label>

    <label class="field">
      <span>Password</span>
      <input type="password" formControlName="password" autocomplete="current-password" placeholder="Your password" />
      @if (signInForm.controls.password.invalid && signInForm.controls.password.touched) {
        <small>Password is required.</small>
      }
    </label>

    @if (errorMessage()) {
      <p class="error-banner">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Signing in...' : 'Sign in' }}
    </button>
  </form>
</section>
