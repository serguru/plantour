<div class="app-shell">
  <header class="toolbar">
    <a class="toolbar__brand" routerLink="/">
		<img src="assets/plantour-logo.png" alt="Plantour logo" class="toolbar__logo" />
      <span>
        <strong>{{ title }}</strong>
        <small>Operations console</small>
      </span>
    </a>

    <nav class="toolbar__nav" aria-label="Main navigation">
      @if (isAuthenticated()) {
      <a
        routerLink="/visitor-activity"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        title="Visitors"
        aria-label="Visitors"
      >
        <span class="toolbar__nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M16 11c1.66 0 2.99-1.57 2.99-3.5S17.66 4 16 4s-3 1.57-3 3.5 1.34 3.5 3 3.5Zm-8 0c1.66 0 2.99-1.57 2.99-3.5S9.66 4 8 4 5 5.57 5 7.5 6.34 11 8 11Zm0 2c-2.33 0-7 1.17-7 3.5V20h14v-3.5C15 14.17 10.33 13 8 13Zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.96 1.97 3.45V20h6v-3.5c0-2.33-4.67-3.5-7-3.5Z" />
          </svg>
        </span>
        <span class="toolbar__nav-label">Visitors</span>
      </a>

      <a
        routerLink="/users"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        title="Users"
        aria-label="Users"
      >
        <span class="toolbar__nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M12 12c2.76 0 5-2.24 5-5S14.76 2 12 2 7 4.24 7 7s2.24 5 5 5Zm0 2c-4.42 0-8 2.01-8 4.5V22h16v-3.5c0-2.49-3.58-4.5-8-4.5Z" />
          </svg>
        </span>
        <span class="toolbar__nav-label">Users</span>
      </a>

      <a
        routerLink="/logs"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        title="Logs"
        aria-label="Logs"
      >
        <span class="toolbar__nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M6 2h9l5 5v15a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm8 1.5V8h4.5" />
            <path d="M8 11h8M8 15h8M8 19h5" />
          </svg>
        </span>
        <span class="toolbar__nav-label">Logs</span>
      </a>

      <a
        routerLink="/settings"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        title="Plantour Settings"
        aria-label="Plantour Settings"
      >
        <span class="toolbar__nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.58.23-1.13.54-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.6.22l2.39-.96c.5.4 1.05.71 1.63.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.58-.23 1.13-.54 1.63-.94l2.39.96c.22.09.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z" />
          </svg>
        </span>
        <span class="toolbar__nav-label">Plantour Settings</span>
      </a>
      }

      <div class="toolbar__menu">
        <button
          type="button"
          class="toolbar__menu-trigger"
          title="Open toolbar menu"
          aria-label="Open toolbar menu"
          aria-haspopup="menu"
          [attr.aria-expanded]="menuOpen()"
          (click)="toggleToolbarMenu($event)"
        >
          <span class="toolbar__nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M4 7h16v2H4V7Zm0 4h16v2H4v-2Zm0 4h16v2H4v-2Z" />
            </svg>
          </span>
        </button>

        @if (menuOpen()) {
        <div class="toolbar__menu-popup" role="menu" aria-label="Toolbar menu">
          <div class="toolbar__menu-group">
            @if (!isAuthenticated()) {
            <a
              class="toolbar__menu-item"
              routerLink="/sign-in"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: true }"
              title="Sign in"
              aria-label="Sign in"
              (click)="closeToolbarMenu()"
            >
              <span class="toolbar__nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <path d="M10 17v-3H3v-4h7V7l5 5-5 5Zm9-13H9a2 2 0 0 0-2 2v3h2V6h10v12H9v-3H7v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Z" />
                </svg>
              </span>
              <span>Sign in</span>
            </a>
            }

            @if (isAuthenticated()) {
            <a
              class="toolbar__menu-item"
              routerLink="/sign-out"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: true }"
              title="Sign out"
              aria-label="Sign out"
              (click)="closeToolbarMenu()"
            >
              <span class="toolbar__nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <path d="M14 17v-3H7v-4h7V7l5 5-5 5ZM5 4h10a2 2 0 0 1 2 2v3h-2V6H5v12h10v-3h2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" />
                </svg>
              </span>
              <span>Sign out</span>
            </a>
            }
          </div>

          <div class="toolbar__menu-divider"></div>

          <div class="toolbar__menu-group toolbar__menu-group--theme" role="group" aria-label="Color theme">
            <span class="toolbar__menu-heading">Theme</span>
            @for (option of themeOptions; track option.value) {
            <button
              type="button"
              class="toolbar__menu-item toolbar__menu-theme-option"
              [class.is-active]="themePreference() === option.value"
              [attr.aria-pressed]="themePreference() === option.value"
              [attr.title]="'Use ' + option.label.toLowerCase() + ' theme'"
              (click)="onThemeOptionClick(option.value)"
            >
              <span>{{ option.label }}</span>
              @if (themePreference() === option.value) {
              <span class="toolbar__menu-check" aria-hidden="true">•</span>
              }
            </button>
            }
          </div>
        </div>
        }
      </div>
    </nav>
  </header>

  <main class="content-shell">
    <router-outlet />
  </main>

  <app-loading />
</div>
