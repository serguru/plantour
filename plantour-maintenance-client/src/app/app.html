<div class="app-shell">
  @if (showNonProductionBanner) {
    <div class="environment-banner">{{ environmentName }} environment - test data only</div>
  }

  <header class="toolbar">
    <a class="toolbar__brand" routerLink="/">
      <span class="toolbar__mark">PT</span>
      <span>
        <strong>{{ title }}</strong>
        <small>Operations console</small>
      </span>
    </a>

    <nav class="toolbar__nav" aria-label="Main navigation">
	    <a routerLink="/dashboard" routerLinkActive="is-active">Dashboard</a>

      @if (isAuthenticated()) {
        <a routerLink="/visitor-activity" routerLinkActive="is-active">Visitors</a>
      }

      @if (!isAuthenticated()) {
        <a routerLink="/sign-in" routerLinkActive="is-active">Sign in</a>
      }

      @if (isAuthenticated()) {
        <a routerLink="/sign-out" routerLinkActive="is-active">Sign out</a>
      }
    </nav>
  </header>

  <main class="content-shell">
    <router-outlet />
  </main>
</div>
